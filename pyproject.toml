[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biohub-cell-tracking"
version = "0.1.0"
description = "Biohub - Cell Tracking During Development Kaggle Solution"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
    "torch>=2.5.0",
    "torchvision",
    "tracksdata @ git+https://github.com/royerlab/tracksdata@main",
    "zarr>=3.0.0",
    "scipy>=1.13.0",
    "polars>=1.0.0",
    "numpy>=1.26.0,<2.0.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.1",
    "kaggle>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "ipykernel",
]
viz = [
    "napari>=0.5.0",
    "pyqt5>=5.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120
